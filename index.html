<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Feliz Navidad!</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a472a, #0d2818);
      font-family: 'Georgia', serif;
      padding: 20px;
    }
    .carta {
      background: #fffdf7;
      max-width: 500px;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      text-align: center;
      border: 3px solid #c5a059;
    }
    h1 {
      color: #b22222;
      font-size: 2.2em;
      margin-bottom: 10px;
    }
    .adorno {
      font-size: 2.5em;
      margin-bottom: 15px;
    }
    p {
      color: #333;
      font-size: 1.15em;
      line-height: 1.6;
    }
    .firma {
      margin-top: 25px;
      font-weight: bold;
      color: #1a472a;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <div class="carta">
    <div class="adorno">🎄✨🎁</div>
    <h1>¡Feliz Navidad!</h1>
    <p>
      Que esta temporada llene tu hogar de alegría, paz y momentos inolvidables junto a las personas que más quieres. ¡Mis mejores deseos para ti y toda tu familia!
    </p>
    <div class="firma">Con cariño, Tu Nombre</div>
  </div>
</body>
</html>
